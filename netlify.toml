# Netlify Forms: who receives submission emails is configured in the app, not here.
# To send the "contact" form to hellomattshade@gmail.com:
# Site configuration → Notifications → Emails and webhooks → Form submission notifications
# → add hellomattshade@gmail.com (all forms or just "contact").

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
